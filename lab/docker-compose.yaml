# The whole lab:  make up   (then open the URLs printed by `make urls`)
# Image tags are pinned so the configs match the software. If a tag has been removed from
# the registry, bump it and re-run ./smoke-test.sh.
x-app: &app
  build: ./app
  restart: unless-stopped
  depends_on: [otel-collector]

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_SEMCONV_STABILITY_OPT_IN: http
  BUILD_ID: "2026.11.2"
  CART_URL: http://cart:8080
  PAYMENTS_URL: http://payments:8080

services:
  storefront:
    <<: *app
    environment: { <<: *otel-env, SERVICE: storefront }
    ports: ["8080:8080"]
  cart:
    <<: *app
    environment: { <<: *otel-env, SERVICE: cart }
  payments:
    <<: *app
    environment: { <<: *otel-env, SERVICE: payments }
    ports: ["8082:8080"]            # only so `make fault-on` can reach /admin/fault
  loadgen:
    build: ./loadgen
    command: ["--url", "http://storefront:8080", "--rps", "15"]
    restart: unless-stopped
    depends_on: [storefront, cart, payments]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.150.0
    command: ["--config=/etc/otelcol/local.yaml"]
    volumes: ["./collector/local.yaml:/etc/otelcol/local.yaml:ro"]
    ports: ["4317:4317", "4318:4318", "8889:8889", "13133:13133"]
    restart: unless-stopped
    depends_on:
      clickhouse: { condition: service_healthy }
      jaeger: { condition: service_started }

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment: { CLICKHOUSE_DB: otel, CLICKHOUSE_USER: otel, CLICKHOUSE_PASSWORD: otel, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1" }
    ports: ["8123:8123", "9000:9000"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    volumes: ["clickhouse-data:/var/lib/clickhouse"]
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "otel", "--password", "otel", "-q", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, clickhouse]

volumes:
  clickhouse-data: {}
